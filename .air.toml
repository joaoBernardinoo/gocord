# Config file for Air (Go hot reload)
# https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"
testdata_dir = "testdata"

[build]
  # Build command
  cmd = "go build -o ./tmp/main ./cmd/server"
  # Binary to execute
  bin = "./tmp/main"
  # Customize binary execution arguments if needed
  args_bin = []
  # Watch these file extensions (including embedded frontend assets)
  include_ext = ["go", "tpl", "tmpl", "html", "css", "js", "json", "png", "svg", "ico"]
  # Ignore these file extensions
  exclude_ext = []
  # Watch these directories
  include_dir = ["cmd", "internal", "web"]
  # Exclude these directories
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "deploy", ".git"]
  # Exclude unchanged files
  exclude_unchanged = true
  # Follow symlinks
  follow_symlink = false
  # Delay in milliseconds after file changes before rebuilding (debounce)
  delay = 300
  # Stop running old binary when build errors occur
  stop_on_error = true
  # Send Interrupt signal (SIGINT) before killing old process so Go server shuts down gracefully
  send_interrupt = true
  # Delay in milliseconds after sending interrupt signal before killing process
  kill_delay = 500
  # Rerun binary or not
  rerun = false
  rerun_delay = 500

[log]
  # Show log time
  time = true
  # Only show main log
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Delete tmp directory on exit
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true

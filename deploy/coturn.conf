# Replace these three example values before starting coturn.
# The host should have a globally routable IPv6 address and no public IPv4
# listener for this service.
listening-ip=2001:db8:1234::20
relay-ip=2001:db8:1234::20
realm=turn.example.com

# STUN/TURN listener. Both UDP and TCP are useful; UDP is preferred by WebRTC.
listening-port=3478

# Restrict relay allocations to a small range for this two-person service.
min-port=49160
max-port=49200

fingerprint

# Time-limited TURN REST credentials generated by the Go server.
use-auth-secret
static-auth-secret=replace-with-the-same-long-random-secret-as-TURN_SHARED_SECRET

# TLS/DTLS TURN is not required for DTLS-SRTP media encryption. If you later
# expose turns: URLs, remove these and configure cert/pkey/tls-listening-port.
no-tls
no-dtls

# Do not expose coturn's local management CLI.
no-cli
